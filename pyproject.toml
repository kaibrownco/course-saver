[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "course-saver"
version = "0.2.0"
description = "Save the Kajabi courses you own so you can watch them offline"
requires-python = ">=3.9"
# Also the dependency list `flet build` bundles into the Windows/Android app, so keep it to what the app needs.
dependencies = [
  "requests>=2.0",
  "beautifulsoup4>=4.0",
  "jsonpickle>=2.0",
  "flet==1.0.3",
  "flet-video==1.0.3",
]

[project.optional-dependencies]
cli = ["click>=8.0", "Jinja2>=3.1.6"]   # command-line tool + static-site export
dev = ["pytest>=8.3.5", "flet-cli==1.0.3", "flet-desktop==1.0.3", "click>=8.0", "Jinja2>=3.1.6"]

[project.scripts]
kajabi-scrape = "cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sitegen = ["templates/*.jinja", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


[tool.flet]
product = "Course Saver"
description = "Save the Kajabi courses you own so you can watch them offline."
org = "co.kaibrown"
company = "Kai Brown"
copyright = "Copyright (C) 2026 Kai Brown"

[tool.flet.app]
path = "src"
module = "main"
exclude = ["cli", "sitegen", "kajabi_scraper.egg-info"]

[tool.flet.android]
permissions = ["INTERNET"]

[tool.flet.windows]
permissions = ["INTERNET"]

# Flet's Android template forces the Flutter package `jni` to 1.0.0, but newer releases of some Flutter plugins need
# jni 1.1+ (directly, or via jni_flutter) and then fail to compile ("generated bindings expect package:jni ^1.1.0"). That happened on 2026-10-22
# when shared_preferences_android 2.5.x shipped. Pin these plugins to versions known to work with jni 1.0.0 so a
# plugin release can't break a build overnight. Bump together with flet/flet-video when upgrading Flet.
[tool.flet.flutter.pubspec.dependency_overrides]
shared_preferences_android = "2.4.28"
path_provider_android = "2.2.23"
url_launcher_android = "6.3.33"
